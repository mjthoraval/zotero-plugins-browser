name: Update last-release dates

# Hourly, so the "Last updated" column stays fresh independent of the upstream
# scraper's 6x/day cadence (a release published just after a scraper run would
# otherwise look stale for hours). Cost is negligible on a public repo: ~8
# GraphQL requests/run, unmetered Actions minutes; only commits on change.
on:
  schedule:
    - cron: '35 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-last-releases.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          if ! git diff --quiet last_release.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add last_release.json
            git commit -m "chore: update last-release dates"
            git push
          fi
